<!DOCTYPE html>

<html>
    <head>
        
        <!-- Preconnect for fonts and style -->
        <link rel="stylesheet" href="{{ url_for('static', path='/style.css?tesdt2') }}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <!-- Custom Font -->
        <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"> -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">

        <!-- ArcGIS-->
        <!--<link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">-->

        <style>
            body {
                font-family: "Roboto", sans-serif
            }
        </style>

        <!-- Meta data... -->
        <meta name="description" content="Website Portfolio for Krupam Patel">
        <meta name="author" content="Krupam Patel">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Title of page for social media. CVan match title tag or be more descriptive -->
        <meta property="og:title" content="Krupam Patel Portfolio">

        <!-- Set for website for static sites or article for content-heavy -->
        <meta property="og:type" content="website">

        <!-- Url of an image that represents the page -->
        <meta property="og:image" content="">
        <meta property="og:image:alt" content="">

        <!-- Favicon (Small image for browser preview ICO)-->
        <link rel="icon" href="{{ url_for('static', path='/icons/favicon.ico') }}" sizes="any">
        <link rel="icon" href="{{ url_for('static', path='/icons/icon.svg') }}" type="image/svg+xml">

        <!-- Apple touch icon -->
        <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='/icons/icon.png') }}">

        <!-- Web App Manifest-->
        <link rel="manifest" href="{{ url_for('static', path='/site.webmanifest') }}">

    </head>
    <body>
        <!-- Broswer title -->
        <title>
            {% if title %}
                {{ title }} | Krupam's Portfolio
            {% else %}
                Krupam Patel Portfolio
            {% endif %}
        </title>
        
        <div id="top-menu-bar" class="top_menu_bar">

            <nav class="menu_bar" aria-label="Main navigation">
                <!-- Logo link -->
                <a href="/" class="logo_link">
                    <img src="{{ url_for('static', path='/icons/logo.png') }}" alt="logo">
                    <p>Krupam Patel Portfolio</p>
                </a>

                <!--Mobile button-->
                <button type="button" class="mobile_nav_toggle" id="mobile-nav-toggle" aria-controls="main-nav-links" aria-expanded="false" aria-label="Open Navigation"><span aria-hidden="true">☰</span></button>

                <!-- Menu Bar -->
                 <!-- Button to open submenu with list of links -->
                <div class="nav_links" id="main-nav-links">

                    <!-- MATES Dropdown-->
                    <div class="nav_dropdown">
                        <button type="button" class="nav_item submenu_toggle" aria-expanded="false" aria-controls="mates-submenu">MATES<span class="submenu_arrow" aria-hidden="true">▼</span></button>
                    
                        <ul class="nav_submenu" id="mates-submenu" hidden>
                            <li>
                                <a href="/mates" class="nav_item {% if active_page == 'mates' %}active{% endif %}">MATES?</a>
                            </li>
                        </ul>
                    </div>
                    <!-- Services dropdown-->
                    <div class="nav_dropdown">
                        <button type="button" class="nav_item submenu_toggle" aria-expanded="false" aria-controls="services-submenu">My Services and Homelab<span class=submenu_arrow aria-hidden="true">▼</span></button>

                        <ul class="nav_submenu" id="services-submenu" hidden>
                            <li>
                                <a href="/services" class="nav_item {% if active_page == 'services' %}active{% endif %}">Services</a>
                            </li>
                            <li>
                                <a href="/homelab" class="nav_item {% if active_page == 'homelab' %}active{% endif %}">My Homelab</a>
                            </li>
                        </ul>
                    </div>

                    

                    <!-- Reg. links-->
                    <a href="/contact" class="nav_item {% if active_page == 'contact' %}active{% endif %}">Contact</a>
                    

                </div>
            </nav>
        </div>

        <!-- Hamburger menu for phone -->
        <script>
            (() => {
                const button = document.getElementById("mobile-nav-toggle");
                const navigation = document.getElementById("main-nav-links");
                const mobileScreen = window.matchMedia("(max-width: 900px)");

                if (!button || !navigation) return;

                const submenuButtons = [
                    ...navigation.querySelectorAll(".submenu_toggle")
                ];

                function setSubmenuOpen(toggle, open) {
                    const submenu = document.getElementById(
                        toggle.getAttribute("aria-controls")
                    );

                    if (!submenu) return;

                    toggle.setAttribute("aria-expanded", String(open));
                    submenu.hidden = !open;
                }

                function closeSubmenus(except = null) {
                    submenuButtons.forEach((toggle) => {
                        if (toggle !== except) {
                            setSubmenuOpen(toggle, false);
                        }
                    });
                }

                function setMenuOpen(open) {
                    navigation.classList.toggle("is_open", open);

                    button.setAttribute("aria-expanded", String(open));
                    button.setAttribute(
                        "aria-label",
                        open ? "Close navigation" : "Open navigation"
                    );

                    button.querySelector("span").textContent = open ? "✕" : "☰";

                    if (!open) {
                        closeSubmenus();
                    }
                }

                // Main mobile hamburger
                button.addEventListener("click", () => {
                    const open = button.getAttribute("aria-expanded") === "true";
                    setMenuOpen(!open);
                });

                // Individual dropdown buttons
                submenuButtons.forEach((toggle) => {
                    toggle.addEventListener("click", () => {
                        const open = toggle.getAttribute("aria-expanded") === "true";

                        // Keep only one submenu open at a time
                        closeSubmenus(toggle);
                        setSubmenuOpen(toggle, !open);
                    });
                });

                // Close menus when a navigation link is selected
                navigation.addEventListener("click", (event) => {
                    if (event.target.closest("a[href]")) {
                        setMenuOpen(false);
                    }
                });

                // Close when clicking outside the navigation
                document.addEventListener("click", (event) => {
                    if (
                        !navigation.contains(event.target) &&
                        !button.contains(event.target)
                    ) {
                        setMenuOpen(false);
                    }
                });

                // Escape closes a submenu first, then the hamburger panel
                document.addEventListener("keydown", (event) => {
                    if (event.key !== "Escape") return;

                    const openSubmenuButton = submenuButtons.find(
                        (toggle) => toggle.getAttribute("aria-expanded") === "true"
                    );

                    if (openSubmenuButton) {
                        setSubmenuOpen(openSubmenuButton, false);
                        openSubmenuButton.focus();
                        event.preventDefault();
                        return;
                    }

                    if (button.getAttribute("aria-expanded") === "true") {
                        setMenuOpen(false);
                        button.focus();
                        event.preventDefault();
                    }
                });

                // Reset menus when crossing the desktop/mobile breakpoint
                mobileScreen.addEventListener("change", () => {
                    setMenuOpen(false);
                });

                // Start with all menus closed
                setMenuOpen(false);
            })();
        </script>

        <!-- Where the other files input -->
        <div>
            {% block content %}
            {% endblock %}
        </div>
        
        <!-- Copyright Footer -->
        <footer class="site_footer">
            <p class="site_footer_text">© 2026 Krupam Patel</p>
            <a class="site_footer_link" href="/contact" aria-label="My Contact info!">
                <span>Contact Me!</span>
            </a>
            <a class="site_footer_link" href="https://github.com/Krupamc/portfolio_website" target="_blank" rel="noopener noreferrer" aria-label="View source code on GitHub">
                <img src="{{ url_for('static', path='/icons/github_logo.png')}}" alt="" class="site_footer_icon">
                <span>View source on GitHub</span>
            </a>
        </footer>
    </body>
</html>
