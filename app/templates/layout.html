<!DOCTYPE html>

<html>
    <head>
        
        <!-- Preconnect for fonts and style -->
        <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <!-- Custom Font -->
        <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"> -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">

        <!-- ArcGIS-->
        <!--<link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">-->

        <style>
            body {
                font-family: "Roboto", sans-serif
            }
        </style>

        <!-- Meta data... -->
        <meta name="description" content="Website Portfolio for Krupam Patel">
        <meta name="author" content="Krupam Patel">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Title of page for social media. CVan match title tag or be more descriptive -->
        <meta property="og:title" content="Krupam Patel Portfolio">

        <!-- Set for website for static sites or article for content-heavy -->
        <meta property="og:type" content="website">

        <!-- Url of an image that represents the page -->
        <meta property="og:image" content="">
        <meta property="og:image:alt" content="">

        <!-- Favicon (Small image for browser preview ICO)-->
        <link rel="icon" href="{{ url_for('static', path='/icons/favicon.ico') }}" sizes="any">
        <link rel="icon" href="{{ url_for('static', path='/icons/icon.svg') }}" type="image/svg+xml">

        <!-- Apple touch icon -->
        <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='/icons/icon.png') }}">

        <!-- Web App Manifest-->
        <link rel="manifest" href="{{ url_for('static', path='/site.webmanifest') }}">

    </head>
    <body class="website_background">
        <!-- Broswer title -->
        <title>
            {% if title %}
                {{ title }}
            {% else %}
                {{system_name}} Mesonet System
            {% endif %}
        </title>
        
        <div id="top-menu-bar" class="top_menu_bar">

            <nav class="menu_bar">
                
                <!-- Menu Bar -->
                <div class="nav_links">
                    <!-- Logo link -->
                    <a href="/" class="logo_link">
                        <img src="{{ url_for('static', path='/icons/logo.png') }}" alt="logo" width="225" class="logo_link">
                    </a>
                    <a href="/stations" class="nav_item {% if active_page == 'stations' %}active{% endif %}">WEATHER STATIONS ▼</a>
                    <a href="/graph" class="nav_item {% if active_page == 'graph' %}active{% endif %}">GRAPHING AND ANALYSIS ▼</a>

                </div>
            </nav>
        </div>

        <!-- Where the other files input -->
        <div>
            {% block content %}
            {% endblock %}
        </div>
        
        <!-- Copyright Footer -->
        <footer class="site_footer">
            <p class="site_footer_text">© 2026 Krupam Patel · Built for the Save Barnegat Bay Mesonet ·</p>
            <a class="site_footer_link" href="https://github.com/Krupamc/portfolio_website" target="_blank" rel="noopener noreferrer" aria-label="View source code on GitHub">
                <img src="{{ url_for('static', path='/icons/github_logo.png')}}" alt="" class="site_footer_icon">
                <span>View source on GitHub</span>
            </a>
        </footer>
    </body>
</html>
